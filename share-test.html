<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share test</title>
<meta name="robots" content="noindex, nofollow">

<!-- A test page, not part of the website. It exists because the share sheet
     on an iPhone cannot be looked at from here, and two days of changing
     things and asking somebody to check is not a way to find a fault.

     This asks the phone itself what it can do, prints the answers in letters
     big enough to photograph, and offers the three ways of sharing one at a
     time so we can see which one the phone will draw a picture for.

     Delete it once the share button works. -->

<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  body{ margin:0; padding:1.2rem; background:#111; color:#fff;
        font:16px/1.5 -apple-system, system-ui, sans-serif; }
  h1{ font-size:1.2rem; margin:0 0 1rem; }
  .row{ padding:.55rem 0; border-bottom:1px solid #333; display:flex; gap:.6rem;
        justify-content:space-between; }
  .k{ color:#aaa; }
  .v{ font-weight:700; text-align:right; word-break:break-all; }
  .yes{ color:#5f5; } .no{ color:#f77; }
  button{ display:block; width:100%; margin:.6rem 0 0; padding:1rem;
          font:700 1rem system-ui; border-radius:.5rem; border:1px solid #666;
          background:#1d1d1d; color:#fff; }
  button.p{ background:#c0161e; border-color:#c0161e; }
  #said{ margin-top:1rem; padding:.8rem; background:#07250f; border:1px solid #2a6;
         border-radius:.5rem; white-space:pre-wrap; font-size:.9rem; min-height:2rem; }
  img{ width:88px; height:88px; object-fit:cover; border-radius:.4rem;
       border:1px solid #444; background:#000; }
</style>
</head>
<body>

<h1>Share test</h1>
<div id="facts"></div>

<p style="color:#aaa;font-size:.85rem;margin-top:1rem">
  The picture this will try to send, drawn here so we know it is really there:
</p>
<img id="pic" alt="">

<button class="p" id="b3">1. Share the PICTURE only</button>
<button id="b2">2. Share the picture AND the link</button>
<button id="b1">3. Share the LINK only</button>
<button id="b4">4. Picture, with NO address anywhere</button>

<div id="said">Tap one. Whatever the phone says lands here.</div>

<script>
(function () {
  "use strict";
  var PIC = "/assets/share/haunted-carnival-sm.jpg";
  var URL_ = "https://ravensteele.com/event-haunted-carnival.html";
  var NAME = "Boss and Ballers Baby Shower";

  var facts = document.getElementById("facts");
  var said = document.getElementById("said");
  var file = null;

  function row(k, v, good) {
    var d = document.createElement("div");
    d.className = "row";
    d.innerHTML = '<span class="k"></span><span class="v"></span>';
    d.children[0].textContent = k;
    d.children[1].textContent = v;
    if (good === true) { d.children[1].className = "v yes"; }
    if (good === false) { d.children[1].className = "v no"; }
    facts.appendChild(d);
  }

  function tell(msg) { said.textContent = msg; }

  row("browser", (navigator.userAgent.match(/CriOS|FxiOS|EdgiOS|Safari|Chrome/g) || ["?"]).join(" "));
  row("can share at all", navigator.share ? "yes" : "NO", !!navigator.share);
  row("can check files", navigator.canShare ? "yes" : "NO", !!navigator.canShare);
  row("secure page", location.protocol === "https:" ? "yes" : "NO",
      location.protocol === "https:");

  document.getElementById("pic").src = PIC;

  fetch(PIC).then(function (r) {
    row("picture downloads", r.status === 200 ? "yes" : "NO " + r.status, r.status === 200);
    return r.blob();
  }).then(function (blob) {
    row("picture size", Math.round(blob.size / 1024) + " kB");
    row("picture type", blob.type || "(none given)");
    var f = new File([blob], "event.jpg", { type: blob.type || "image/jpeg" });
    var ok = navigator.canShare ? navigator.canShare({ files: [f] }) : false;
    row("phone accepts the file", ok ? "YES" : "NO", ok);
    if (ok) { file = f; }
  }).catch(function (e) {
    row("picture downloads", "FAILED", false);
    tell("could not fetch the picture: " + e);
  });

  function go(what, data) {
    if (!navigator.share) { tell("this browser has no share at all"); return; }
    tell("opening the sheet for: " + what + " ...");
    navigator.share(data).then(function () {
      tell(what + "\nShared, no error.\n\nDid the top of the sheet show the photograph?");
    }).catch(function (e) {
      tell(what + "\nThe phone refused it.\n\n" + (e && e.name) + ": " + (e && e.message));
    });
  }

  document.getElementById("b3").addEventListener("click", function () {
    if (!file) { tell("the picture is not ready yet, wait a second and try again"); return; }
    go("PICTURE ONLY", { files: [file], text: NAME + "\n" + URL_ });
  });
  document.getElementById("b2").addEventListener("click", function () {
    if (!file) { tell("the picture is not ready yet, wait a second and try again"); return; }
    go("PICTURE AND LINK", { files: [file], title: NAME, text: NAME, url: URL_ });
  });
  document.getElementById("b1").addEventListener("click", function () {
    go("LINK ONLY", { title: NAME, text: NAME, url: URL_ });
  });
  document.getElementById("b4").addEventListener("click", function () {
    if (!file) { tell("the picture is not ready yet"); return; }
    go("PICTURE, NO ADDRESS", { files: [file] });
  });
})();
</script>
</body>
</html>
